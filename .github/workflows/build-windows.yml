name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./scripts/build.ps1 -Version "0.1.${{ github.run_number }}"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ssh-sketchbook-installer-${{ github.run_number }}
          path: dist/installer/ssh-sketchbook-setup.exe
          if-no-files-found: error
          retention-days: 30
